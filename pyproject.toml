[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "web-retrieval-research"
version = "0.1.0"
description = "Traceable REST adapters and MCP tools for web retrieval experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "mcp>=1.0,<2"]

[project.scripts]
web-research = "web_retrieval_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_retrieval_research"]
